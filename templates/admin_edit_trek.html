{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('admin_treks') }}" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Treks</a>
<h3 class="mt-2 mb-3">Edit Trek</h3>

<div class="card p-4">
<form method="POST">
    <div class="mb-3">
        <label>Trek Name</label>
        <input type="text" name="name" value="{{ trek.name }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Location</label>
        <input type="text" name="location" value="{{ trek.location }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Difficulty</label>
        <select name="difficulty" class="form-select" required>
            <option value="Easy" {% if trek.difficulty=='Easy' %}selected{% endif %}>Easy</option>
            <option value="Moderate" {% if trek.difficulty=='Moderate' %}selected{% endif %}>Moderate</option>
            <option value="Hard" {% if trek.difficulty=='Hard' %}selected{% endif %}>Hard</option>
        </select>
    </div>
    <div class="mb-3">
        <label>Duration (Days)</label>
        <input type="number" name="duration" value="{{ trek.duration }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Available Slots</label>
        <input type="number" name="slots" value="{{ trek.available_slots }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Assign Staff</label>
        <select name="staff_id" class="form-select">
            <option value="">-- None --</option>
            {% for s in staff_list %}
            <option value="{{ s.id }}" {% if trek.staff_id==s.id %}selected{% endif %}>{{ s.name }} (ID: {{ s.id }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label>Status</label>
        <select name="status" class="form-select" required>
            {% for st in ['Pending', 'Approved', 'Open', 'Closed', 'Completed'] %}
            <option value="{{ st }}" {% if trek.status==st %}selected{% endif %}>{{ st }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label>Start Date</label>
        <input type="date" name="start_date" value="{{ trek.start_date }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>End Date</label>
        <input type="date" name="end_date" value="{{ trek.end_date }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Description</label>
        <textarea name="description" class="form-control">{{ trek.description }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary px-4">Save</button>
</form>
</div>
{% endblock %}
