{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">Browse Treks</h3>

<div class="card p-3 mb-3">
<form method="GET" class="row g-2">
    <div class="col-auto">
        <select name="difficulty" class="form-select">
            <option value="">All Difficulty</option>
            <option value="Easy" {% if difficulty=='Easy' %}selected{% endif %}>Easy</option>
            <option value="Moderate" {% if difficulty=='Moderate' %}selected{% endif %}>Moderate</option>
            <option value="Hard" {% if difficulty=='Hard' %}selected{% endif %}>Hard</option>
        </select>
    </div>
    <div class="col-auto">
        <input type="text" name="location" value="{{ location }}" class="form-control" placeholder="Location">
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> Filter</button>
    </div>
</form>
</div>

<div class="card p-3">
<table class="table table-borderless align-middle mb-0">
    <thead><tr><th>Name</th><th>Location</th><th>Difficulty</th><th>Duration</th><th>Slots</th><th>Action</th></tr></thead>
    <tbody>
    {% for t in treks %}
    <tr>
        <td>{{ t.name }}</td>
        <td>{{ t.location }}</td>
        <td>{{ t.difficulty }}</td>
        <td>{{ t.duration }} Days</td>
        <td>{{ t.available_slots }}</td>
        <td><a href="{{ url_for('user_trek_details', trek_id=t.id) }}" class="btn btn-sm btn-primary">Book Now</a></td>
    </tr>
    {% else %}
    <tr><td colspan="6" class="text-muted text-center py-3">No treks match your filters</td></tr>
    {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
